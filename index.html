<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICS 人員配置</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5}
.pg{padding:18px 14px 32px;font-family:var(--font-sans)}
.hdr{text-align:center;margin-bottom:18px}
.hdr h1{font-size:17px;font-weight:500;color:#333;margin-bottom:3px}
.hdr p{font-size:12px;color:#666}

.chart-wrap{overflow-x:auto;margin-bottom:20px}
.chart{min-width:860px;padding:6px 8px 8px;display:flex;flex-direction:column;align-items:center}
.vl{width:1px;background:#ddd}
.hl{height:1px;background:#ddd}
.dl{border-top:1px dashed #ddd;background:none;height:0}

.nd{border-radius:8px;border:0.5px solid;padding:7px 12px;text-align:center;cursor:pointer;transition:opacity .15s;user-select:none}
.nd:hover{opacity:.78}
.nd .rl{font-size:11px;font-weight:500;margin-bottom:2px}
.nd .nm{font-size:11px}
.nd .mt{font-size:10px;margin-top:2px;opacity:.65}
.nd .em{font-size:11px;font-style:italic;opacity:.55}

.ic {background:#EEEDFE;border-color:#534AB7;color:#3C3489}.ic .nm{color:#534AB7}
.st {background:#F1EFE8;border-color:#5F5E5A;color:#444441}.st .nm{color:#5F5E5A}
.op {background:#FAECE7;border-color:#993C1D;color:#712B13}.op .nm{color:#993C1D}
.pl {background:#E1F5EE;border-color:#0F6E56;color:#085041}.pl .nm{color:#0F6E56}
.sb {background:#FAECE7;border-color:#D85A30;color:#712B13}.sb .nm{color:#993C1D}
.med{background:#FFF3EE;border-color:#D85A30;color:#712B13}.med .nm{color:#993C1D}
.sq {background:#FFF3EE;border-color:#D85A30;color:#712B13}.sq .nm{color:#993C1D}
.lg {background:#E6F1FB;border-color:#185FA5;color:#0C447C}.lg .nm{color:#185FA5}

.roster{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.r-section{border:0.5px solid #ddd;border-radius:10px;overflow:hidden}
.r-head{padding:8px 14px;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:space-between}
.r-row{display:flex;align-items:center;gap:0;padding:6px 14px;border-top:0.5px solid #eee;font-size:12px}
.r-role{min-width:88px;color:#666;font-size:11px}
.r-name{font-weight:500;color:#333;margin-right:6px}
.r-bg{color:#999;font-size:11px}
.r-empty{padding:8px 14px;font-size:11px;font-style:italic;color:#bbb}
.r-del-btn{background:transparent;border:none;font-size:20px;color:#d32f2f;cursor:pointer;padding:0 8px;line-height:1;font-weight:300}
.r-del-btn:hover{color:#ff5252}

.mbg{background:rgba(0,0,0,0.28);min-height:360px;display:none;align-items:center;justify-content:center;border-radius:12px;margin:10px 0;padding:14px}
.mbg.open{display:flex}
.mbox{background:white;border:0.5px solid #ddd;border-radius:12px;padding:18px;width:100%;max-width:400px}
.mtag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;margin-bottom:6px}
.mbox h2{font-size:14px;font-weight:500;color:#333;margin-bottom:12px}
.mlist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;max-height:280px;overflow-y:auto}
.mrow{display:flex;gap:5px;align-items:center}
.mrow input{font-size:12px;padding:6px 8px;border-radius:6px;border:0.5px solid #ddd;background:#f9f9f9;color:#333}
.mrow .mi{flex:1}.mrow .mb{flex:1.2}
.mrow .mrole{font-size:10px;min-width:48px;text-align:center;padding:4px;border-radius:4px;background:#f0f0f0;color:#666}
.mrow .mdel{font-size:16px;color:#999;cursor:pointer;padding:0 3px;line-height:1;border:none;background:transparent}
.mrow .mdel:hover{color:#d32f2f}
.badd{font-size:12px;color:#0C447C;border:0.5px dashed #185FA5;background:transparent;padding:6px;border-radius:6px;cursor:pointer;width:100%;margin-bottom:8px}
.badd:hover{background:#f0f8ff}
.mbtns{display:flex;gap:6px;margin-top:12px}
.bsave{flex:1;padding:8px;border-radius:8px;border:0.5px solid #185FA5;background:#E6F1FB;color:#0C447C;font-size:13px;font-weight:500;cursor:pointer}
.bsave:hover{background:#B5D4F4}
.bcancel{padding:8px 12px;border-radius:8px;border:0.5px solid #ddd;background:transparent;color:#666;font-size:13px;cursor:pointer}
.bcancel:hover{background:#f5f5f5}

.sbar{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:0.5px solid #eee}
.sbar span{font-size:12px;color:#999}
.bexp{padding:6px 12px;border-radius:8px;border:0.5px solid #ddd;background:transparent;color:#666;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px}
.bexp:hover{background:#f5f5f5}

.toast{position:fixed;bottom:20px;right:20px;background:#333;color:white;padding:12px 16px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .3s;z-index:9999}
.toast.show{opacity:1}
  </style>
</head>
<body>

<div class="pg">
<div class="hdr">
  <h1>ICS 事故指揮系統 — 人員配置</h1>
  <p>點擊任意職位填寫成員，自動同步至 Google Sheet</p>
</div>

<div class="chart-wrap"><div class="chart">

  <div style="display:flex;align-items:center">
    <div class="nd ic" onclick="openModal('ic')" style="min-width:148px">
      <div class="rl">事故指揮官 IC</div>
      <div id="dn-ic" class="nm">黃碩焜</div>
    </div>
    <div style="width:14px" class="dl"></div>
    <div style="border-left:1px dashed #ddd;display:flex;flex-direction:column;gap:5px">
      <div style="display:flex;align-items:center">
        <div style="width:12px" class="dl"></div>
        <div class="nd st" onclick="openModal('safety')" style="min-width:112px">
          <div class="rl">安全官</div><div id="dn-safety" class="nm">何長益</div>
        </div>
      </div>
      <div style="display:flex;align-items:center">
        <div style="width:12px" class="dl"></div>
        <div class="nd st" onclick="openModal('liaison')" style="min-width:112px">
          <div class="rl">聯絡官</div><div id="dn-liaison" class="nm">張皓亭</div>
        </div>
      </div>
    </div>
  </div>

  <div class="vl" style="height:16px"></div>
  <div style="display:flex"><div style="width:240px" class="hl"></div><div style="width:240px" class="hl"></div></div>
  <div style="display:flex;width:480px;justify-content:space-between">
    <div class="vl" style="height:14px"></div>
    <div class="vl" style="height:14px"></div>
    <div class="vl" style="height:14px"></div>
  </div>

  <div style="display:flex;gap:20px;align-items:flex-start">

    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="nd op" onclick="openModal('ops')" style="min-width:130px">
        <div class="rl">執行組</div><div id="dn-ops" class="nm">高誌駿</div><div id="mt-ops" class="mt"></div>
      </div>
      <div class="vl" style="height:12px"></div>
      <div style="width:480px" class="hl"></div>
      <div style="display:flex;width:480px;justify-content:space-between">
        <div class="vl" style="height:12px"></div><div class="vl" style="height:12px"></div>
      </div>
      <div style="display:flex;gap:20px;align-items:flex-start">
        <div style="display:flex;flex-direction:column;align-items:center">
          <div class="nd med" onclick="openModal('med')" style="min-width:114px">
            <div class="rl">醫療組</div><div id="dn-med" class="em">待填</div><div id="mt-med" class="mt"></div>
          </div>
          <div class="vl" style="height:10px"></div>
          <div style="width:300px" class="hl"></div>
          <div style="display:flex;width:300px;justify-content:space-between">
            <div class="vl" style="height:10px"></div><div class="vl" style="height:10px"></div>
            <div class="vl" style="height:10px"></div><div class="vl" style="height:10px"></div>
          </div>
          <div style="display:flex;gap:5px">
            <div class="nd sb" onclick="openModal('triage')" style="min-width:64px">
              <div class="rl">檢傷</div><div id="dn-triage" class="em">待填</div><div id="mt-triage" class="mt"></div>
            </div>
            <div class="nd sb" onclick="openModal('treatment')" style="min-width:64px">
              <div class="rl">中重傷區</div><div id="dn-treatment" class="em">待填</div><div id="mt-treatment" class="mt"></div>
            </div>
            <div class="nd sb" onclick="openModal('minor')" style="min-width:64px">
              <div class="rl">輕傷區</div><div id="dn-minor" class="em">待填</div><div id="mt-minor" class="mt"></div>
            </div>
            <div class="nd sb" onclick="openModal('transport')" style="min-width:64px">
              <div class="rl">後送</div><div id="dn-transport" class="em">待填</div><div id="mt-transport" class="mt"></div>
            </div>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center">
          <div class="nd sb" onclick="openModal('rescue')" style="min-width:100px">
            <div class="rl">搜救組</div><div id="dn-rescue" class="em">待填</div><div id="mt-rescue" class="mt"></div>
          </div>
          <div class="vl" style="height:10px"></div>
          <div style="width:216px" class="hl"></div>
          <div style="display:flex;width:216px;justify-content:space-between">
            <div class="vl" style="height:10px"></div><div class="vl" style="height:10px"></div><div class="vl" style="height:10px"></div>
          </div>
          <div style="display:flex;gap:5px">
            <div class="nd sq" onclick="openModal('squad1')" style="min-width:64px">
              <div class="rl">一分隊</div><div id="dn-squad1" class="em">待填</div><div id="mt-squad1" class="mt"></div>
            </div>
            <div class="nd sq" onclick="openModal('squad2')" style="min-width:64px">
              <div class="rl">二分隊</div><div id="dn-squad2" class="em">待填</div><div id="mt-squad2" class="mt"></div>
            </div>
            <div class="nd sq" onclick="openModal('squad3')" style="min-width:64px">
              <div class="rl">三分隊</div><div id="dn-squad3" class="em">待填</div><div id="mt-squad3" class="mt"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="nd pl" onclick="openModal('plan')" style="min-width:120px">
        <div class="rl">計劃組</div><div id="dn-plan" class="em">待填</div><div id="mt-plan" class="mt"></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="nd lg" onclick="openModal('log')" style="min-width:110px">
        <div class="rl">後勤組</div><div id="dn-log" class="nm">明麗</div><div id="mt-log" class="mt"></div>
      </div>
    </div>

  </div>
</div></div>

<div class="roster" id="roster"></div>

<div class="mbg" id="mbg">
  <div class="mbox">
    <div class="mtag" id="mtag"></div>
    <h2 id="mtitle"></h2>
    <div class="mlist" id="mlist"></div>
    <button class="badd" onclick="addRow()"><i class="fas fa-plus"></i> 新增成員</button>
    <div class="mbtns">
      <button class="bcancel" onclick="closeModal()">取消</button>
      <button class="bsave" onclick="saveModal()">儲存並同步</button>
    </div>
  </div>
</div>

<div class="sbar">
  <span id="stxt">已填：0 人</span>
  <button class="bexp" onclick="exportData()"><i class="fas fa-download"></i> 本機匯出</button>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyImhhHJGJ12BHJ3czivAcmF_4hfbaWftwDD7KhkN_gI1Gm-6x19T0Me-5GUE7PYLZM/exec";

const CFG = {
  ic:        {label:'事故指揮官 IC', group:'指揮幕僚', hs:'ic',   leaderRole:'指揮官'},
  safety:    {label:'安全官',        group:'指揮幕僚', hs:'staff',leaderRole:'安全官'},
  liaison:   {label:'聯絡官',        group:'指揮幕僚', hs:'staff',leaderRole:'聯絡官'},
  ops:       {label:'執行組',        group:'執行組',   hs:'ops',  leaderRole:'組長'},
  med:       {label:'醫療組',        group:'執行組',   hs:'med',  leaderRole:'組長'},
  triage:    {label:'檢傷',          group:'執行組',   hs:'sub',  leaderRole:'負責人'},
  treatment: {label:'中重傷區',      group:'執行組',   hs:'sub',  leaderRole:'負責人'},
  minor:     {label:'輕傷區',        group:'執行組',   hs:'sub',  leaderRole:'負責人'},
  transport: {label:'後送',          group:'執行組',   hs:'sub',  leaderRole:'負責人'},
  rescue:    {label:'搜救組',        group:'執行組',   hs:'sub',  leaderRole:'組長'},
  squad1:    {label:'搜救一分隊',    group:'執行組',   hs:'squad',leaderRole:'分隊長'},
  squad2:    {label:'搜救二分隊',    group:'執行組',   hs:'squad',leaderRole:'分隊長'},
  squad3:    {label:'搜救三分隊',    group:'執行組',   hs:'squad',leaderRole:'分隊長'},
  plan:      {label:'計劃組',        group:'計劃組',   hs:'plan', leaderRole:'組長'},
  log:       {label:'後勤組',        group:'後勤組',   hs:'log',  leaderRole:'組長'},
};

const HS = {
  ic:   {bg:'#EEEDFE',color:'#3C3489'},
  staff:{bg:'#F1EFE8',color:'#444441'},
  ops:  {bg:'#FAECE7',color:'#712B13'},
  med:  {bg:'#FFF3EE',color:'#712B13'},
  sub:  {bg:'#FAECE7',color:'#712B13'},
  squad:{bg:'#FFF3EE',color:'#712B13'},
  plan: {bg:'#E1F5EE',color:'#085041'},
  log:  {bg:'#E6F1FB',color:'#0C447C'},
};

const ROSTER_GROUPS = [
  {key:'指揮幕僚', color:'#534AB7', bg:'#EEEDFE'},
  {key:'執行組',   color:'#993C1D', bg:'#FAECE7'},
  {key:'計劃組',   color:'#0F6E56', bg:'#E1F5EE'},
  {key:'後勤組',   color:'#185FA5', bg:'#E6F1FB'},
];

const DATA = {};
const DEFAULTS = {
  ic:      [],
  safety:  [],
  liaison: [],
  ops:     [],
  med:     [],
  triage:  [],
  treatment: [],
  minor:   [],
  transport: [],
  rescue:  [],
  squad1:  [],
  squad2:  [],
  squad3:  [],
  plan:    [],
  log:     [],
};

function initializeDATA() {
  Object.keys(CFG).forEach(k => { 
    DATA[k] = (DEFAULTS[k]||[]).map(m=>({...m})); 
  });
}

initializeDATA();

let CUR = null;
let ORIGINAL_DATA = null;

function openModal(k) {
  CUR = k;
  ORIGINAL_DATA = JSON.parse(JSON.stringify(DATA[k]));
  const c = CFG[k], ts = HS[c.hs];
  const tag = document.getElementById('mtag');
  tag.textContent = c.label; tag.style.background = ts.bg; tag.style.color = ts.color;
  document.getElementById('mtitle').textContent = c.label + ' 成員';
  renderMList(k);
  document.getElementById('mbg').classList.add('open');
}

function renderMList(k) {
  const c = CFG[k], list = document.getElementById('mlist');
  list.innerHTML = '';
  if (!DATA[k].length) DATA[k].push({role:c.leaderRole, name:'', bg:''});
  DATA[k].forEach((m,i) => {
    const row = document.createElement('div');
    row.className = 'mrow';
    row.innerHTML = `<span class="mrole">${i===0?c.leaderRole:'組員'}</span>
      <input class="mi" type="text" placeholder="姓名" value="${esc(m.name)}">
      <input class="mb" type="text" placeholder="身份/背景" value="${esc(m.bg)}">
      ${i>0?`<button class="mdel" onclick="delRow(${i})" aria-label="刪除">×</button>`:'<span style="width:18px"></span>'}`;
    list.appendChild(row);
  });
}

function esc(s){return (s||'').replace(/"/g,'&quot;');}
function addRow(){if(!CUR)return;DATA[CUR].push({role:'組員',name:'',bg:''});renderMList(CUR);}
function delRow(i){if(!CUR)return;DATA[CUR].splice(i,1);renderMList(CUR);}

async function saveModal(){
  if(!CUR)return;
  const c=CFG[CUR], rows=document.querySelectorAll('#mlist .mrow');
  const newData=[];
  rows.forEach((row,i)=>{
    const ins=row.querySelectorAll('input');
    newData.push({role:i===0?c.leaderRole:'組員', name:ins[0].value.trim(), bg:ins[1].value.trim()});
  });
  
  DATA[CUR]=newData;
  
  for(let i = 0; i < newData.length; i++) {
    const newMember = newData[i];
    const oldMember = ORIGINAL_DATA[i];
    
    if(newMember.name) {
      if(oldMember && oldMember.name) {
        // 如果原本有資料，檢查是否修改
        if(oldMember.name !== newMember.name || oldMember.role !== newMember.role || oldMember.bg !== newMember.bg) {
          console.log('🔄 偵測到修改：', oldMember, ' → ', newMember);
          // 先刪除舊記錄（需要 rowIndex）
          if(oldMember.rowIndex) {
            await deletePersonFromSheetSync(oldMember.rowIndex);
          }
          // 再添加新記錄
          await syncToGoogleSheet(CUR, newMember);
        }
      } else {
        // 新增的人員
        await syncToGoogleSheet(CUR, newMember);
      }
    } else if(oldMember && oldMember.name && oldMember.rowIndex) {
      // 刪除了這個人員
      await deletePersonFromSheetSync(oldMember.rowIndex);
    }
  }
  
  updateNode(CUR); closeModal(); renderRoster(); updateStatus();
  
  setTimeout(() => loadDataFromGoogleSheet(), 500);
}

async function syncToGoogleSheet(key, member) {
  if(!GOOGLE_SCRIPT_URL.includes('script.google.com')) {
    showToast('⚠️ 未設定 Google Apps Script URL，資料無法同步。請參考上方設定步驟');
    return;
  }
  try {
    const payload = {
      role: CFG[key].label,
      title: member.role,
      name: member.name,
      bg: member.bg,
    };
    const response = await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload),
    });
    const result = await response.json();
    if(result.success) {
      showToast('✅ 已同步至 Google Sheet');
    } else if(result.isDuplicate) {
      showToast('⚠️ ' + result.message + '，跳過重複登錄');
    } else {
      showToast('❌ 上傳失敗：' + (result.error || '未知錯誤'));
    }
  } catch(err) {
    showToast('❌ 同步失敗：' + err.message);
  }
}

async function deletePersonFromSheetSync(rowIndex) {
  if(!GOOGLE_SCRIPT_URL.includes('script.google.com')) {
    return false;
  }
  try {
    const url = GOOGLE_SCRIPT_URL + '?rowIndex=' + rowIndex;
    const response = await fetch(url, { method: 'GET' });
    const result = await response.json();
    return result.success;
  } catch(err) {
    console.log('❌ 同步刪除失敗:', err.message);
    return false;
  }
}

async function deletePersonFromSheet(rowIndex) {
  if(!GOOGLE_SCRIPT_URL.includes('script.google.com')) {
    showToast('⚠️ 無法刪除');
    return;
  }
  try {
    const url = GOOGLE_SCRIPT_URL + '?rowIndex=' + rowIndex;
    const response = await fetch(url, {
      method: 'GET',
    });
    const result = await response.json();
    if(result.success) {
      showToast('✅ 已刪除此人員');
      setTimeout(() => loadDataFromGoogleSheet(), 500);
    } else {
      showToast('❌ 刪除失敗');
    }
  } catch(err) {
    showToast('❌ 刪除失敗：' + err.message);
  }
}

function closeModal(){document.getElementById('mbg').classList.remove('open');CUR=null;}

function updateNode(k){
  const members=DATA[k].filter(m=>m.name);
  const el=document.getElementById('dn-'+k), mt=document.getElementById('mt-'+k);
  if(!el)return;
  const leader=members[0];
  if(leader){el.textContent=leader.name+(leader.bg?' · '+leader.bg:'');el.className='nm';}
  else{el.textContent='待填';el.className='em';}
  if(mt){const crew=members.slice(1);mt.textContent=crew.length?'共 '+members.length+' 人':'';}
}

function renderRoster(){
  const container=document.getElementById('roster');
  container.innerHTML='';
  ROSTER_GROUPS.forEach(g=>{
    const keys=Object.keys(CFG).filter(k=>CFG[k].group===g.key);
    const allMembers=[];
    keys.forEach(k=>DATA[k].filter(m=>m.name).forEach(m=>allMembers.push({section:CFG[k].label,...m})));
    const sec=document.createElement('div');
    sec.className='r-section';
    const head=document.createElement('div');
    head.className='r-head';
    head.style.background=g.bg; head.style.color=g.color;
    head.innerHTML=`<span style="font-weight:500">${g.key}</span><button class="bexp" style="border-color:${g.color};color:${g.color}" onclick="openFirstInGroup('${g.key}')">編輯</button>`;
    sec.appendChild(head);
    const body=document.createElement('div'); body.className='r-body';
    if(!allMembers.length){body.innerHTML='<div class="r-empty">尚未填寫任何成員</div>';}
    else{
      allMembers.forEach(m=>{
        const row=document.createElement('div'); row.className='r-row';
        row.style.justifyContent='space-between';
        const nameDiv = document.createElement('div');
        nameDiv.style.flex='1';
        nameDiv.innerHTML=`<span class="r-role">${m.section} · ${m.role}</span><span class="r-name">${m.name}</span>${m.bg?'<span class="r-bg">'+m.bg+'</span>':''}`;
        row.appendChild(nameDiv);
        
        const delBtn = document.createElement('button');
        delBtn.className='r-del-btn';
        delBtn.innerHTML='×';
        delBtn.onclick=()=>deletePersonFromSheet(m.rowIndex);
        row.appendChild(delBtn);
        
        body.appendChild(row);
      });
    }
    sec.appendChild(body); container.appendChild(sec);
  });
}

function openFirstInGroup(g){
  const k=Object.keys(CFG).find(k=>CFG[k].group===g);
  if(k) openModal(k);
}

function updateStatus(){
  let t=0; Object.keys(DATA).forEach(k=>DATA[k].forEach(m=>{if(m.name)t++;}));
  document.getElementById('stxt').textContent='已填：'+t+' 人';
}

function exportData(){
  let lines=['ICS 人員配置清單\n'];
  ROSTER_GROUPS.forEach(g=>{
    lines.push('【'+g.key+'】');
    Object.keys(CFG).filter(k=>CFG[k].group===g.key).forEach(k=>{
      const members=DATA[k].filter(m=>m.name);
      if(members.length){
        lines.push('  ['+CFG[k].label+']');
        members.forEach(m=>lines.push('    '+m.role+'：'+m.name+(m.bg?'（'+m.bg+'）':'')));
      }
    });
    lines.push('');
  });
  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='ICS人員配置.txt'; a.click();
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

async function loadDataFromGoogleSheet() {
  if(!GOOGLE_SCRIPT_URL.includes('script.google.com')) {
    console.log('❌ 未設定有效的 Google Apps Script URL');
    return;
  }
  try {
    console.log('🔄 開始從 Google Sheet 讀取資料...');
    const response = await fetch(GOOGLE_SCRIPT_URL);
    console.log('📡 API 回應狀態:', response.status);
    
    const result = await response.json();
    console.log('📊 API 返回的資料:', result);
    
    if(result.success && result.data && result.data.length > 0) {
      console.log('✅ 讀取成功，共', result.data.length, '筆資料');
      
      Object.keys(DATA).forEach(k => { DATA[k] = []; });
      
      result.data.forEach((item, idx) => {
        const roleLabel = item.role;
        console.log('📍 處理第', idx+1, '筆：職位="' + roleLabel + '"、姓名="' + item.name + '"');
        
        const key = Object.keys(CFG).find(k => CFG[k].label === roleLabel);
        if(key) {
          const member = {
            role: item.title,
            name: item.name,
            bg: item.bg,
            rowIndex: item.rowIndex
          };
          DATA[key].push(member);
          console.log('✔️ 成功對應到', key, '，現在該職位共', DATA[key].length, '人');
        } else {
          console.log('⚠️ 警告：找不到職位代碼，職位標籤為："' + roleLabel + '"');
          console.log('📋 可用的職位標籤:', Object.keys(CFG).map(k => CFG[k].label));
        }
      });
      
      console.log('📋 最終 DATA 物件:', DATA);
      renderRoster();
      updateStatus();
      Object.keys(CFG).forEach(k => updateNode(k));
      console.log('✅ 網頁已更新完成');
    } else {
      console.log('⚠️ 沒有讀取到資料，或 API 返回失敗:', result);
    }
  } catch(err) {
    console.log('❌ 讀取失敗:', err.message, err);
  }
}

Object.keys(CFG).forEach(k=>updateNode(k));
renderRoster(); updateStatus();

loadDataFromGoogleSheet();
setInterval(loadDataFromGoogleSheet, 3000);
</script>
